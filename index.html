<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inception</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 55px;
    left: 40px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 85px;
    left: 40px;
    white-space: pre-line;
    line-height: 1.8em;
  }

  #typing-area {
    position: absolute;
    top: 270px;
    left: 40px;
    right: 40px;
    bottom: 40px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  .letter, .apple, .temp {
    position: absolute;
    font-family: 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
    letter-spacing: -1px;
  }

  .apple {
    width: 30px;
    height: 30px;
  }

  .temp {
    opacity: 0.5;
  }

  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="title">Inception</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton’s apple. The rules are as follows:
1. You can type any letters or numbers.
2. Place the cursor anywhere, type, and then press Enter.
3. Type “Apple” or “apple” and observe what happens.
4. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0"></div>
<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
let gravity = 'down';
let elements = [];
let currentInput = [];
let cursor = {x: 10, y: 10};
const letterSize = 20;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];

function updateCursor() {
  cursorEl.style.left = (typingArea.offsetLeft + cursor.x) + 'px';
  cursorEl.style.top = (typingArea.offsetTop + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

typingArea.addEventListener('click', (e) => {
  const rect = typingArea.getBoundingClientRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;
  updateCursor();
  typingArea.focus();
  cursorEl.style.animation = "blink 1s step-start infinite";
});

function createTempChar(char, x, y) {
  const temp = document.createElement('span');
  temp.className = 'letter temp';
  temp.textContent = char;
  temp.style.left = x + 'px';
  temp.style.top = y + 'px';
  typingArea.appendChild(temp);
  return {char, x, y};
}

// 기존 moveElement 대신 그룹 단위로 이동
function createWordAt(chars, x, y) {
  const groupEls = chars.map(c => {
    const el = document.createElement('span');
    el.className = 'letter';
    el.textContent = c.char;
    el.style.left = (c.x) + 'px';
    el.style.top = (c.y) + 'px';
    typingArea.appendChild(el);
    return el;
  });

  elements.push({els: groupEls, type: 'word'});
  moveWord(groupEls);
}

function moveWord(groupEls) {
  const area = typingArea.getBoundingClientRect();
  let moved = true;

  function step() {
    if (!moved) return;
    moved = false;

    let dx = 0, dy = 0;
    if (gravity === 'down') dy = 2;
    else if (gravity === 'up') dy = -2;
    else if (gravity === 'left') dx = -2;
    else if (gravity === 'right') dx = 2;

    let blocked = groupEls.some(el => {
      const left = parseFloat(el.style.left) + dx;
      const top = parseFloat(el.style.top) + dy;
      const size = letterSize;
      return elements.some(obj => {
        if (obj.els && obj.els.includes(el)) return false;
        return obj.els.some(oel => {
          const ox = parseFloat(oel.style.left);
          const oy = parseFloat(oel.style.top);
          return left < ox + size && left + size > ox &&
                 top < oy + size && top + size > oy;
        });
      }) || 
      left < 0 || left + letterSize > area.width ||
      top < 0 || top + letterSize > area.height;
    });

    if (!blocked) {
      groupEls.forEach(el => {
        el.style.left = (parseFloat(el.style.left) + dx) + 'px';
        el.style.top = (parseFloat(el.style.top) + dy) + 'px';
      });
      moved = true;
      requestAnimationFrame(step);
    }
  }

  step();
}

function createAppleAt(x, y) {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.className = 'apple';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  typingArea.appendChild(el);
  elements.push({els: [el], type:'apple'});
  moveWord([el]);
}

function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % 4];
}

typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.els.forEach(el=>el.remove()));
    elements = [];
    currentInput = [];
    cursor.x = 10;
    cursor.y = 10;
    gravity = 'down';
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
    updateCursor();
  } else if (e.key === 'Enter') {
    if(currentInput.length === 0) return;
    let word = currentInput.map(c => c.char).join('');
    if (word.toLowerCase() === 'apple') {
      createAppleAt(currentInput[0].x, currentInput[0].y);
    } else {
      createWordAt(currentInput, currentInput[0].x, currentInput[0].y);
    }
    currentInput = [];
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
  } else if (e.key === 'Backspace') {
    if (currentInput.length > 0) {
      currentInput.pop();
      const spans = typingArea.querySelectorAll('.temp');
      if (spans.length > 0) spans[spans.length -1].remove();
      if (currentInput.length > 0) {
        cursor.x = currentInput[currentInput.length -1].x + letterSize;
        cursor.y = currentInput[currentInput.length -1].y;
      }
      else {
        cursor.x = 10;
        cursor.y = 10;
      }
      updateCursor();
    }
  } else if (e.key.length === 1) {
    const tempChar = createTempChar(e.key, cursor.x, cursor.y);
    currentInput.push(tempChar);
    cursor.x += letterSize;
    updateCursor();
  }
});

updateCursor();
typingArea.focus();
</script>

</body>
</html>
