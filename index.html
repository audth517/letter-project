<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>"Apple"</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 140px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 165px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 230px;
    left: 60px;
    right: 60px;
    bottom: 100px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
    height: 16px;
    display: none;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  @keyframes quake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-2px, 2px); }
    20%  { transform: translate(2px, -2px); }
    30%  { transform: translate(-3px, 1px); }
    40%  { transform: translate(3px, -1px); }
    50%  { transform: translate(-2px, 2px); }
    60%  { transform: translate(2px, -2px); }
    70%  { transform: translate(-1px, 1px); }
    80%  { transform: translate(1px, -1px); }
    90%  { transform: translate(-2px, 0); }
    100% { transform: translate(0, 0); }
  }

  #typing-area.shake {
    animation: quake 0.45s linear 1;
  }

  .hint {
    position: absolute;
    padding: 6px 10px;
    border: 1px solid #dbd7d4;
    border-radius: 6px;
    background: rgba(255,255,255,0.95);
    font-size: 12px;
    color: #413e3e;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 2px 2px 8px rgba(188,185,183,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
</style>
</head>
<body>

<div id="title">"Apple"</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. 
Press Esc to reset.
</div>

<div id="typing-area" tabindex="0"></div>
<div id="cursor"></div>
<div class="hint" id="hint">Type anywhere + press Enter ⏎</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Composite } = Matter;

const typingArea = document.getElementById('typing-area');
const cursor = document.getElementById('cursor');
const hint = document.getElementById('hint');

// Matter.js 엔진 생성
const engine = Engine.create();
const world = engine.world;

const render = Render.create({
  element: typingArea,
  engine: engine,
  options: {
    width: typingArea.clientWidth,
    height: typingArea.clientHeight,
    wireframes: false,
    background: 'transparent'
  }
});

Render.run(render);
Runner.run(Runner.create(), engine);

// 벽 생성
const walls = [
  Bodies.rectangle(typingArea.clientWidth/2, typingArea.clientHeight, typingArea.clientWidth, 20, { isStatic: true }),
  Bodies.rectangle(typingArea.clientWidth/2, 0, typingArea.clientWidth, 20, { isStatic: true }),
  Bodies.rectangle(typingArea.clientWidth, typingArea.clientHeight/2, 20, typingArea.clientHeight, { isStatic: true }),
  Bodies.rectangle(0, typingArea.clientHeight/2, 20, typingArea.clientHeight, { isStatic: true })
];
World.add(world, walls);

// 초기 중력 아래로
const gravities = [
  {x:0, y:1}, {x:-1, y:0}, {x:0, y:-1}, {x:1, y:0}
];
let gravityIndex = 0;
engine.gravity.x = gravities[gravityIndex].x;
engine.gravity.y = gravities[gravityIndex].y;

function earthquake() {
  typingArea.classList.add('shake');
  setTimeout(()=> typingArea.classList.remove('shake'), 500);
  const bodies = Composite.allBodies(world);
  bodies.forEach(b => {
    Body.applyForce(b, b.position, {
      x: (Math.random() - 0.5) * 0.2,
      y: (Math.random() - 0.5) * 0.2
    });
  });
}

// 상태
let isActive = false;
let inputBuffer = "";

// 더블 클릭 시 커서 표시 + 힌트
typingArea.addEventListener('dblclick', (e) => {
  isActive = true;
  cursor.style.left = e.offsetX + 'px';
  cursor.style.top = e.offsetY + 'px';
  cursor.style.display = 'block';

  hint.style.left = (e.pageX + 10) + 'px';
  hint.style.top = (e.pageY - 20) + 'px';
  hint.style.opacity = 1;

  setTimeout(()=> hint.style.opacity = 0, 1200);
});

// 타이핑 입력
document.addEventListener('keydown', (e) => {
  if (!isActive) return;
  if (e.key === 'Escape') {
    location.reload();
  }
  else if (e.key === 'Enter') {
    if (inputBuffer.trim() !== "") {
      addTextToWorld(inputBuffer);
      if (inputBuffer.toLowerCase() === "apple") {
        earthquake();
        gravityIndex = (gravityIndex + 1) % gravities.length;
        engine.gravity.x = gravities[gravityIndex].x;
        engine.gravity.y = gravities[gravityIndex].y;
      }
      inputBuffer = "";
    }
  }
  else if (e.key.length === 1) {
    inputBuffer += e.key;
  }
});

function addTextToWorld(text) {
  const letters = text.split('');
  const startX = Math.random() * (typingArea.clientWidth - letters.length*20) + 40;
  letters.forEach((char, i) => {
    const body = Bodies.rectangle(startX + i * 20, 80, 20, 20, {
      restitution: 0.4,
      render: { fillStyle: '#413e3e' },
      label: char
    });
    World.add(world, body);
  });
}

// Matter.js 커스텀 렌더링 (문자 표시)
(function renderText() {
  const ctx = render.context;
  const bodies = Composite.allBodies(world);
  ctx.font = '16px Courier New';
  ctx.fillStyle = '#413e3e';
  Matter.Render.startViewTransform(render);
  bodies.forEach(body => {
    if (body.label.length === 1) {
      const pos = body.position;
      ctx.fillText(body.label, pos.x - 5, pos.y + 5);
    }
  });
  Matter.Render.endViewTransform(render);
  requestAnimationFrame(renderText);
})();
</script>
</body>
</html>
