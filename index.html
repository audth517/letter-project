<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter Project</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 35px; /* 기존 20px + 15px */
    left: 30px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 75px; /* 기존 60px + 15px */
    left: 30px;
    white-space: pre-line;
    line-height: 1.8em; /* 문장간 띄움 */
  }

  #typing-area {
    position: absolute;
    top: 195px; /* 기존 160px + 35px(위 여백 + 추가) */
    left: 30px;
    right: 30px;
    bottom: 30px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 8px;
    box-shadow: 4px 4px 15px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  .letter, .apple {
    position: absolute;
    font-family: 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
  }

  .apple {
    width: 30px;
    height: 30px;
  }

  /* 깜빡이는 커서 */
  #cursor {
    position: absolute;
    width: 2px;
    background-color: #404e3e;
    animation: blink 1s step-start infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="title">Inception</div>
<div id="description">
This project is inspired by Inception and Newton’s apple. The rules are as follows:

1 You can type any letters or numbers.
2 Place the cursor anywhere, type, and then press Enter.
3 Type “Apple” or “apple” and observe what happens.
4 Press Esc to reset.
</div>

<div id="typing-area" tabindex="0"></div>
<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
let gravity = 'down';
let elements = [];
let cursor = {x: 10, y: 10};
const letterSize = 20;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];

function updateCursor() {
  cursorEl.style.left = (typingArea.offsetLeft + cursor.x) + 'px';
  cursorEl.style.top = (typingArea.offsetTop + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

typingArea.addEventListener('click', (e) => {
  const rect = typingArea.getBoundingClientRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;
  updateCursor();
  typingArea.focus();
});

function createLetter(char) {
  const el = document.createElement('span');
  el.className = 'letter';
  el.textContent = char;
  el.style.left = cursor.x + 'px';
  el.style.top = cursor.y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type:'letter'});
  moveElement(el, 'letter');
}

function createApple() {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.className = 'apple';
  el.style.left = cursor.x + 'px';
  el.style.top = cursor.y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type:'apple'});
  moveElement(el, 'apple');
}

function moveElement(el, type) {
  const area = typingArea.getBoundingClientRect();
  let top = parseFloat(el.style.top);
  let left = parseFloat(el.style.left);
  const size = type === 'letter' ? letterSize : appleSize;

  function isBlocked(nextX, nextY) {
    for (let obj of elements) {
      if (obj.el === el) continue;
      const ox = parseFloat(obj.el.style.left);
      const oy = parseFloat(obj.el.style.top);
      const osize = obj.type === 'letter' ? letterSize : appleSize;
      if (nextX < ox + osize && nextX + size > ox &&
          nextY < oy + osize && nextY + size > oy) {
        return true;
      }
    }
    return false;
  }

  function step() {
    let moved = false;
    if (gravity === 'down') {
      if (top + size + 2 <= area.height && !isBlocked(left, top+2)) { top += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'left') {
      if (left - 2 >= 0 && !isBlocked(left-2, top)) { left -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'up') {
      if (top - 2 >= 0 && !isBlocked(left, top-2)) { top -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'right') {
      if (left + size + 2 <= area.width && !isBlocked(left+2, top)) { left += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    }
    el.style.top = top + 'px';
    el.style.left = left + 'px';
    if (moved) requestAnimationFrame(step);
  }
  step();
}

function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % 4];
}

typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.el.remove());
    elements = [];
    gravity = 'down';
  } else if (e.key === 'Enter') {
    const text = typingArea.textContent.trim();
    if (!text) return;
    if (text.toLowerCase() === 'apple') createApple();
    else for (let char of text) createLetter(char);
    typingArea.textContent = '';
    updateCursor();
  } else if (e.key.length === 1) {
    typingArea.textContent += e.key;
  }
  updateCursor();
});

updateCursor();
typingArea.focus();
</script>

</body>
</html>
