<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inception</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }
  #title {
    position: absolute;
    top: 60px;
    left: 50px;
    font-size: 24px;
    font-weight: bold;
  }
  #description {
    position: absolute;
    top: 95px;
    left: 50px;
    white-space: pre-line;
    line-height: 1.5em;
  }
  #typing-area {
    position: absolute;
    top: 270px;
    left: 50px;
    right: 50px;
    bottom: 50px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }
  .letter, .apple, .temp {
    position: absolute;
    font-family: 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
    letter-spacing: -1.3px;
  }
  .apple {
    width: 30px;
    height: 30px;
  }
  .temp {
    opacity: 0.5;
  }
  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="title">Inception</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton’s apple. The rules are as follows:
1. You can type any letters or numbers.
2. Place the cursor anywhere, type, and then press Enter.
3. Type "Apple" or "apple" and see what happens.
4. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0"></div>
<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
let gravity = 'down';
let elements = [];
let currentInput = [];
let cursor = {x: 10, y:10};
const letterSize = 20;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];

// 그룹 단어 배열 관리 (예: 현재는 한 단어 단위 그룹)
function getGroupByElement(el) {
  // 간단 예: 한 글자씩 개별 그룹 처리 (사용자 필요에 따라 수정)
  return elements.filter(obj => obj.type === 'letter');
}

// 커서 위치 업데이트
function updateCursor() {
  cursorEl.style.left = (typingArea.offsetLeft + cursor.x) + 'px';
  cursorEl.style.top = (typingArea.offsetTop + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

// 클릭 시 커서 위치 설정 및 깜빡임 활성화
typingArea.addEventListener('click', (e) => {
  const rect = typingArea.getBoundingClientRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;
  updateCursor();
  typingArea.focus();
  cursorEl.style.animation = "blink 1s step-start infinite";
});

// 임시 글자 표시
function createTempChar(char, x, y) {
  const temp = document.createElement('span');
  temp.className = 'letter temp';
  temp.textContent = char;
  temp.style.left = x + 'px';
  temp.style.top = y + 'px';
  typingArea.appendChild(temp);
  return {char, x, y};
}

// 실제 글자 생성
function createLetterAt(char, x, y) {
  const el = document.createElement('span');
  el.className = 'letter';
  el.textContent = char;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type: 'letter'});
  moveElement(el, 'letter');
}

// 실제 사과 생성
function createAppleAt(x, y) {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.className = 'apple';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type: 'apple'});
  moveElement(el, 'apple');
}

// 충돌 체크
function isBlocked(nextX, nextY, excludeEl = null) {
  for (let obj of elements) {
    if (obj.el === excludeEl) continue;
    const ox = parseFloat(obj.el.style.left);
    const oy = parseFloat(obj.el.style.top);
    const osize = obj.type === 'letter' ? letterSize : appleSize;
    if (nextX < ox + osize && nextX + letterSize > ox &&
        nextY < oy + osize && nextY + letterSize > oy) {
      return true;
    }
  }
  return false;
}

// 그룹 전체를 오른쪽으로 이동
function moveGroupToRight(group) {
  const area = typingArea.getBoundingClientRect();
  let canMove = true;

  while (canMove) {
    for (let obj of group) {
      const nextLeft = parseFloat(obj.el.style.left) + 2;
      if (nextLeft + letterSize > area.width || isBlocked(nextLeft, parseFloat(obj.el.style.top), obj.el)) {
        canMove = false;
        break;
      }
    }
    if (canMove) {
      group.forEach(obj => {
        obj.el.style.left = (parseFloat(obj.el.style.left) + 2) + 'px';
      });
    }
  }
}

// 요소 이동 함수 (그룹 지원 확장)
function moveElement(el, type) {
  const area = typingArea.getBoundingClientRect();
  let top = parseFloat(el.style.top);
  let left = parseFloat(el.style.left);
  const size = type === 'letter' ? letterSize : appleSize;

  function step() {
    let moved = false;

    if (gravity === 'down') {
      if (top + size + 2 <= area.height && !isBlocked(left, top + 2, el)) {
        top += 2;
        moved = true;
      } else if (type === 'apple') {
        rotateGravity();
      }
    } else if (gravity === 'left') {
      if (left - 2 >= 0 && !isBlocked(left -2, top, el)) {
        left -= 2;
        moved = true;
      } else if (type === 'apple') {
        rotateGravity();
      }
    } else if (gravity === 'up') {
      if (top - 2 >= 0 && !isBlocked(left, top - 2, el)) {
        top -= 2;
        moved = true;
      } else if (type === 'apple') {
        rotateGravity();
      }
    } else if (gravity === 'right') {
      // 오른쪽 중력 시 그룹 단위 이동
      let group = getGroupByElement(el);
      moveGroupToRight(group);
      return;
    }

    el.style.top = top + 'px';
    el.style.left = left + 'px';

    if (moved) requestAnimationFrame(step);
  }

  step();
}

// 중력 회전
function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % gravityOrder.length];
}

// 키 입력 처리
typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.el.remove());
    elements = [];
    currentInput = [];
    cursor.x = 10;
    cursor.y = 10;
    gravity = 'down';
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
    updateCursor();
  } else if (e.key === 'Enter') {
    if (currentInput.length === 0) return;
    let word = currentInput.map(c => c.char).join('');
    if (word.toLowerCase() === 'apple') {
      createAppleAt(currentInput[0].x, currentInput[0].y);
    } else {
      currentInput.forEach(obj => {
        createLetterAt(obj.char, obj.x, obj.y);
      });
    }
    currentInput = [];
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
  } else if (e.key === 'Backspace') {
    if (currentInput.length > 0) {
      currentInput.pop();
      const spans = typingArea.querySelectorAll('.temp');
      if (spans.length > 0) spans[spans.length - 1].remove();
      if (currentInput.length > 0) {
        cursor.x = currentInput[currentInput.length -1].x + letterSize;
        cursor.y = currentInput[currentInput.length -1].y;
      } else {
        cursor.x = 10;
        cursor.y = 10;
      }
      updateCursor();
    }
  } else if (e.key.length === 1) {
    const tempChar = createTempChar(e.key, cursor.x, cursor.y);
    currentInput.push(tempChar);
    cursor.x += letterSize;
    updateCursor();
  }
});

updateCursor();
typingArea.focus();
</script>

</body>
</html>
