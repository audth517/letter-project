<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inception</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Courier New', monospace;
    background: linear-gradient(to bottom, #f1e9e2, #d2cbc6);
    color: #403d3c;
    overflow: hidden;
    user-select: none;
  }
  #bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40px;
    border-bottom: 1px solid #403d3c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
  }
  #bar-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  #canvas {
    position: absolute;
    top: 40px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
    outline: none;
  }
  .text-item {
    position: absolute;
    white-space: pre;
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="bar-left">Esc</div>
    <div id="bar-center">Apple</div>
    <div id="bar-right">Enter</div>
  </div>
  <div id="canvas" tabindex="0"></div>

<script>
  const canvas = document.getElementById('canvas');
  let gravity = 'down'; // down, left, up, right
  let typedText = '';
  let textElements = [];

  canvas.focus();

  function getPositionForText(textElem, dir) {
    const rects = textElements.map(e => e.getBoundingClientRect());
    const canvasRect = canvas.getBoundingClientRect();
    let x = 10, y = 10;

    if(dir === 'down') {
      y = 10;
      x = 10;
      rects.forEach(r => {
        if(r.left <= x && x <= r.right && r.top <= y && y <= r.bottom){
          y = r.bottom + 2;
        }
      });
    } else if(dir === 'up') {
      y = canvas.clientHeight - 30;
      rects.forEach(r => {
        if(r.left <= x && x <= r.right && r.top <= y && y <= r.bottom){
          y = r.top - 20;
        }
      });
    } else if(dir === 'left') {
      x = canvas.clientWidth - 30;
      rects.forEach(r => {
        if(r.top <= y && y <= r.bottom && r.left <= x && x <= r.right){
          x = r.left - textElem.offsetWidth;
        }
      });
    } else if(dir === 'right') {
      x = 10;
      rects.forEach(r => {
        if(r.top <= y && y <= r.bottom && r.left <= x && x <= r.right){
          x = r.right + 2;
        }
      });
    }
    return {x, y};
  }

  function renderGravityChange() {
    textElements.forEach(e => {
      const pos = getPositionForText(e, gravity);
      e.style.left = pos.x + 'px';
      e.style.top = pos.y + 'px';
    });
  }

  canvas.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') {
      textElements.forEach(el => el.remove());
      textElements = [];
      gravity = 'down';
      typedText = '';
      return;
    }
    if(e.key === 'Backspace') {
      typedText = typedText.slice(0, -1);
      e.preventDefault();
      return;
    }
    if(e.key === 'Enter') {
      if(typedText.toLowerCase() === 'apple') {
        const dirs = ['down', 'left', 'up', 'right'];
        gravity = dirs[(dirs.indexOf(gravity)+1)%4];
        renderGravityChange();
      } else if(typedText.length > 0) {
        const span = document.createElement('span');
        span.className = 'text-item';
        span.textContent = typedText;
        canvas.appendChild(span);
        textElements.push(span);
        const pos = getPositionForText(span, gravity);
        span.style.left = pos.x + 'px';
        span.style.top = pos.y + 'px';
      }
      typedText = '';
      e.preventDefault();
      return;
    }
    if(e.key.length === 1) {
      typedText += e.key;
    }
  });
</script>
</body>
</html>
