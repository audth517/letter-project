<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inception</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 95px;
    left: 70px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 270px;
    left: 70px;
    right: 70px;
    bottom: 70px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  .letter, .apple, .temp {
    position: absolute;
    font-family: 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
    letter-spacing: -10px;
  }

  .apple {
    width: 30px;
    height: 30px;
  }

  .temp {
    opacity: 0.5;
  }

  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="title">Inception</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. The rules are as follows:
1. You can type any letters or numbers.
2. Place the cursor anywhere, type, and then press Enter.
3. Type "Apple" and observe what happens.
4. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0"></div>
<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
let gravity = 'down';
let elements = [];
let currentInput = [];
let cursor = {x: 10, y: 10};
const letterSize = 30;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];

function updateCursor() {
  cursorEl.style.left = (typingArea.offsetLeft + cursor.x) + 'px';
  cursorEl.style.top = (typingArea.offsetTop + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

typingArea.addEventListener('click', (e) => {
  const rect = typingArea.getBoundingClientRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;
  updateCursor();
  typingArea.focus();
  cursorEl.style.animation = "blink 1s step-start infinite";
});

function createTempChar(char, x, y) {
  const temp = document.createElement('span');
  temp.className = 'letter temp';
  temp.textContent = char;
  temp.style.left = x + 'px';
  temp.style.top = y + 'px';
  typingArea.appendChild(temp);
  return {char, x, y};
}

// currentWordElements 배열로 그룹화된 입력 글자 요소 생성 함수
function createLettersGroup(chars) {
  const group = [];
  for (const obj of chars) {
    const el = document.createElement('span');
    el.className = 'letter';
    el.textContent = obj.char;
    el.style.left = obj.x + 'px';
    el.style.top = obj.y + 'px';
    typingArea.appendChild(el);
    group.push({el, type: 'letter'});
    elements.push(group[group.length - 1]);
  }
  return group;
}

function createAppleAt(x, y) {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.className = 'apple';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type:'apple'});
  moveElement(el, 'apple');
}

// 오른쪽 중력일 때 그룹 글자 동시에 오른쪽 이동
function moveLettersGroupRight(group) {
  const area = typingArea.getBoundingClientRect();
  const size = letterSize;
  let moved = false;

  for (let obj of group) {
    let left = parseFloat(obj.el.style.left);
    let top = parseFloat(obj.el.style.top);

    function isBlocked(nextX, nextY, selfEl) {
      for (let other of elements) {
        if (other.el === selfEl) continue;
        const ox = parseFloat(other.el.style.left);
        const oy = parseFloat(other.el.style.top);
        const osize = other.type === 'letter' ? letterSize : appleSize;
        if (nextX < ox + osize && nextX + size > ox &&
            nextY < oy + osize && nextY + size > oy) {
          return true;
        }
      }
      return false;
    }

    if (left + size + 2 <= area.width && !isBlocked(left + 2, top, obj.el)) {
      obj.el.style.left = (left + 2) + 'px';
      moved = true;
    }
  }

  if (moved) {
    requestAnimationFrame(() => moveLettersGroupRight(group));
  }
}

function moveElement(el, type) {
  const area = typingArea.getBoundingClientRect();
  let top = parseFloat(el.style.top);
  let left = parseFloat(el.style.left);
  const size = type === 'letter' ? letterSize : appleSize;

  function isBlocked(nextX, nextY) {
    for (let obj of elements) {
      if (obj.el === el) continue;
      const ox = parseFloat(obj.el.style.left);
      const oy = parseFloat(obj.el.style.top);
      const osize = obj.type === 'letter' ? letterSize : appleSize;
      if (nextX < ox + osize && nextX + size > ox &&
          nextY < oy + osize && nextY + size > oy) {
        return true;
      }
    }
    return false;
  }

  function step() {
    let moved = false;
    if (gravity === 'down') {
      if (top + size + 2 <= area.height && !isBlocked(left, top+2)) { top += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'left') {
      if (left - 2 >= 0 && !isBlocked(left-2, top)) { left -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'up') {
      if (top - 2 >= 0 && !isBlocked(left, top-2)) { top -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'right') {
      if (type === 'apple') {
        if (left + size + 2 <= area.width && !isBlocked(left + 2, top)) {
          left += 2; moved = true;
        } else {
          rotateGravity();
        }
      }
      // letter 타입 개별 이동은 여기서 처리하지 않음
    }
    el.style.top = top + 'px';
    el.style.left = left + 'px';
    if (moved) requestAnimationFrame(step);
  }
  step();
}

function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % 4];
}

typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.el.remove());
    elements = [];
    currentInput = [];
    cursor.x = 10;
    cursor.y = 10;
    gravity = 'down';
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
    updateCursor();
  } else if (e.key === 'Enter') {
    if(currentInput.length === 0) return;
    let word = currentInput.map(c => c.char).join('');
    if (word.toLowerCase() === 'apple') {
      createAppleAt(currentInput[0].x, currentInput[0].y);
    } else {
      // 그룹으로 글자 생성
      const group = createLettersGroup(currentInput);
      if (gravity === 'right') {
        moveLettersGroupRight(group);
      } else {
        // 오른쪽 중력이 아니면 개별 이동 실행
        group.forEach(obj => moveElement(obj.el, 'letter'));
      }
    }
    currentInput = [];
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.remove());
  } else if (e.key === 'Backspace') {
    if (currentInput.length > 0) {
      currentInput.pop();
      const spans = typingArea.querySelectorAll('.temp');
      if (spans.length > 0) spans[spans.length -1].remove();
      if (currentInput.length > 0) {
        cursor.x = currentInput[currentInput.length -1].x + letterSize;
        cursor.y = currentInput[currentInput.length -1].y;
      }
      else {
        cursor.x = 10;
        cursor.y = 10;
      }
      updateCursor();
    }
  } else if (e.key.length === 1) {
    const tempChar = createTempChar(e.key, cursor.x, cursor.y);
    currentInput.push(tempChar);
    cursor.x += letterSize;
    updateCursor();
  }
});

updateCursor();
typingArea.focus();
</script>

</body>
</html>
