<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inception</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Courier New', monospace;
    background: linear-gradient(to bottom, #efe5dd, #d0c8c2);
    color: #403d3c;
    overflow: hidden;
    user-select: none;
  }
  #bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40px;
    border-bottom: 1px solid #403d3c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
  }
  #bar-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  #canvas {
    position: absolute;
    top: 40px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
  }
  .text-item {
    position: absolute;
    white-space: pre;
  }
  .cursor {
    display: inline-block;
    width: 6px;
    background-color: #585554;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="bar-left">Esc</div>
    <div id="bar-center">Apple</div>
    <div id="bar-right">Enter</div>
  </div>
  <div id="canvas" tabindex="0"></div>

<script>
  const canvas = document.getElementById('canvas');
  let gravity = 'down';
  let typedText = '';
  let typingPosition = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let typingSpan = null;
  let cursorSpan = null;
  let textElements = [];
  
  function rotateGravity() {
    const dirs = ['down', 'left', 'up', 'right'];
    gravity = dirs[(dirs.indexOf(gravity) + 1) % 4];
  }

  canvas.addEventListener('click', (e) => {
    if (typingSpan) typingSpan.remove();
    typedText = '';

    typingPosition.x = e.clientX;
    typingPosition.y = e.clientY - canvas.offsetTop;

    typingSpan = document.createElement('span');
    typingSpan.className = 'text-item';
    typingSpan.style.left = typingPosition.x + 'px';
    typingSpan.style.top = typingPosition.y + 'px';

    cursorSpan = document.createElement('span');
    cursorSpan.className = 'cursor';
    cursorSpan.textContent = ' ';

    typingSpan.appendChild(cursorSpan);
    canvas.appendChild(typingSpan);
    canvas.focus();
  });

  function applyGravity(el) {
    const step = 6;
    const interval = setInterval(() => {
      const rect = el.getBoundingClientRect();
      if (gravity === 'down' && el.offsetTop + el.offsetHeight < canvas.offsetHeight) {
        el.style.top = Math.min(canvas.offsetHeight - el.offsetheight, el.offsetTop + step) + 'px';
      } else if (gravity === 'up' && rect.top > 0) {
        el.style.top = Math.max(0, el.offsetTop - step) + 'px';
      } else if (gravity === 'left' && rect.left > 0) {
        el.style.left = Math.max(0, el.offsetLeft - step) + 'px';
      } else if (gravity === 'right' && rect.right < window.innerWidth) {
        el.style.left = Math.min(window.innerWidth - rect.width, el.offsetLeft + step) + 'px';
      } else {
        clearInterval(interval);
      }
    }, 10);
  }

  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      textElements.forEach(el => el.remove());
      if (typingSpan) typingSpan.remove();
      textElements = [];
      gravity = 'down';
      typedText = '';
      typingSpan = null;
      return;
    }

    if (!typingSpan) return;

    if (e.key === 'Backspace') {
      typedText = typedText.slice(0, -1);
      typingSpan.textContent = typedText;
      typingSpan.appendChild(cursorSpan);
      e.preventDefault();
      return;
    }

    if (e.key === 'Enter') {

      if (typedText.toLowerCase() === 'apple') {
        rotateGravity();
        textElements.forEach(el => applyGravity(el));
      } else if (typedText.length > 0) {
        const finished = document.createElement('span');
        finished.className = 'text-item';
        finished.textContent = typedText;
        finished.style.left = typingSpan.style.left;
        finished.style.top = typingSpan.style.top;
        canvas.appendChild(finished);
        textElements.push(finished);
        applyGravity(finished);
      }
      typingSpan.remove();
      typingSpan = null;
      typedText = '';
      e.preventDefault();
      return;
    }

    if (e.key.length === 1) {
      typedText += e.key;
      typingSpan.textContent = typedText;
      typingSpan.appendChild(cursorSpan);
    }
  });
</script>
</body>
</html>
