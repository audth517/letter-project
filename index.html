<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>: apple</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 130px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
    white-space: pre;
  }

  #description {
    position: absolute;
    top: 150px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 230px;
    left: 60px;
    right: 60px;
    bottom: 100px;
    border: 0.6pt solid #d1d0cf;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  #matter-canvas {
    position: absolute;
    left: 0;
    top: 0;
    image-rendering: pixelated; 
  }

  #cursor {
    position: absolute;
    width: 6px;
    height: 18px;
    background-color: #404e3e;
    display: none;
    animation: blink 0.8s infinite;
    pointer-events: none;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  .hint {
    position: absolute;
    padding: 6px 10px;
    border: 1px solid #dbd7d4;
    border-radius: 6px;
    background: rgba(255,255,255,0.95);
    font-size: 12px;
    color: #413e3e;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 2px 2px 8px rgba(188,185,183,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #typing-preview {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    font: 16px 'Courier New', monospace;
    color: #413e3e;
  }

  .preview-char {
    position: absolute;
    font: inherit;
    color: inherit;
    user-select: none;
    line-height: 1;
  }

  .apple {
    width: 33px;
    height: 45px;
  }

  .title-cursor {
    display: inline-block;
    width: 8px;
    background-color: #413e3e;
    margin-left: 2px;
    animation: blink 0.8s infinite;
  }

  @keyframes quake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-2px, 2px); }
    20%  { transform: translate(2px, -2px); }
    30%  { transform: translate(-3px, 1px); }
    40%  { transform: translate(3px, -1px); }
    50%  { transform: translate(-2px, 2px); }
    60%  { transform: translate(2px, -2px); }
    70%  { transform: translate(-1px, 1px); }
    80%  { transform: translate(1px, -1px); }
    90%  { transform: translate(-2px, 0); }
    100% { transform: translate(0, 0); }
  }
  #typing-area.shake {
    animation: quake 0.45s linear 1;
  }
</style>
</head>
<body>

<div id="title">": "</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0">
  <canvas id="matter-canvas"></canvas>
  <div id="typing-preview"></div>
</div>
<div id="cursor"></div>
<div class="hint" id="hint">Type anywhere + press Enter ⏎</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>

const titleEl = document.getElementById('title');

function wait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function blinkCursor(times = 2, after = '') {
  for (let i = 0; i < times; i++) {
    titleEl.innerHTML = `:${after}<span class="title-cursor"></span>`;
    await wait(300);
    titleEl.innerHTML = `:${after}`;
    await wait(300);
  }
}

async function typeTitleLoop() {
  while (true) {
    titleEl.textContent = ':';
    await blinkCursor(2);

    const text = ' apple';
    for (let i = 0; i < text.length; i++) {
      titleEl.textContent = ':' + text.slice(0, i + 1);
      await wait(150);
    }

    await blinkCursor(2, ' apple');
  }
}
typeTitleLoop();

(() => {
  const { Engine, Render, Runner, World, Bodies, Composite, Events } = Matter;

  const typingArea   = document.getElementById('typing-area');
  const cursorEl     = document.getElementById('cursor');
  const hintEl       = document.getElementById('hint');
  const previewLayer = document.getElementById('typing-preview');
  const canvasEl     = document.getElementById('matter-canvas');

  const pixelRatio = window.devicePixelRatio || 1;

  const Wcss = typingArea.clientWidth;
  const Hcss = typingArea.clientHeight;

  const engine = Engine.create();
  const world = engine.world;

  const render = Render.create({
    element: typingArea,
    engine,
    canvas: canvasEl,
    options: {
      width: Wcss,
      height: Hcss,
      pixelRatio: pixelRatio,
      wireframes: false,
      background: 'transparent'
    }
  });

  canvasEl.width  = Wcss * pixelRatio;
  canvasEl.height = Hcss * pixelRatio;
  canvasEl.style.width  = Wcss + 'px';
  canvasEl.style.height = Hcss + 'px';

  const baseGetContext = render.context;
  baseGetContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  const walls = [
    Bodies.rectangle(Wcss/2, Hcss+10, Wcss, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(Wcss/2, -10,     Wcss, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(-10,   Hcss/2,   20,   Hcss, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(Wcss+10,Hcss/2,  20,   Hcss, { isStatic: true, render: { visible: false } })
  ];
  World.add(world, walls);

  const gravities = [
    {x: 0,  y: 1},
    {x: -1, y: 0},
    {x: 0,  y: -1},
    {x: 1,  y: 0},
  ];
  let gIndex = 0;
  engine.gravity.x = gravities[gIndex].x;
  engine.gravity.y = gravities[gIndex].y;
  engine.gravity.scale = 0.001;

  const measureProbe = document.createElement('span');
  measureProbe.style.position = 'absolute';
  measureProbe.style.visibility = 'hidden';
  measureProbe.style.font = "16px 'Courier New', monospace";
  measureProbe.style.lineHeight = '1';
  measureProbe.textContent = 'M'; 
  document.body.appendChild(measureProbe);
  const charAdvance = measureProbe.getBoundingClientRect().width;
  const charHeight  = measureProbe.getBoundingClientRect().height;
  document.body.removeChild(measureProbe);

  let caretBaseX = Wcss / 2;
  let caretBaseY = Hcss / 2;

  let caretCol = 0;

  let active = false;
  let buffer = "";
  let previewChars = [];

  function logicalToScreenX(col) {
    return caretBaseX + col * charAdvance;
  }
  function logicalToScreenY() {
    return caretBaseY - (charHeight * 0.6);
  }

  function updateCursor() {
    const rect = typingArea.getBoundingClientRect();
    const screenX = logicalToScreenX(caretCol);
    const screenY = caretBaseY;

    cursorEl.style.left = (rect.left + screenX - 2) + 'px';
    cursorEl.style.top  = (rect.top  + screenY - (charHeight * 0.7)) + 'px';
  }

  function clearPreview() {
    previewChars.forEach(n => n.remove());
    previewChars = [];
  }

  function redrawPreview() {
    clearPreview();
    for (let i = 0; i < buffer.length; i++) {
      const span = document.createElement('span');
      span.className = 'preview-char';
      span.textContent = buffer[i];
      span.style.left = logicalToScreenX(i) + 'px';
      span.style.top  = logicalToScreenY()  + 'px';
      previewLayer.appendChild(span);
      previewChars.push(span);
    }
  }

  function quake() {
    typingArea.classList.remove('shake');
    void typingArea.offsetWidth; // reflow to restart animation
    typingArea.classList.add('shake');
    setTimeout(() => typingArea.classList.remove('shake'), 500);
  }

  function commitBufferAsBodies(text) {
    const width = charAdvance * text.length;
    const height = charHeight * 1.4; // 여유
  
    const bodyX = caretBaseX + width / 2;
    const bodyY = caretBaseY;
  
    const body = Bodies.rectangle(bodyX, bodyY, width, height, {
      restitution: 0.25,
      friction: 0.2,
      frictionAir: 0.01,
      label: `chunk:${text}`,
      render: {
        fillStyle: "transparent",
        strokeStyle: "transparent"
      }
    });
  
    World.add(world, body);
  }

  function createAppleSprite() {
    const w = 33;
    const h = 45;
    const bodyX = logicalToScreenX(0);
    const bodyY = caretBaseY;
  
    const body = Matter.Bodies.rectangle(bodyX, bodyY, w, h, {
      restitution: 0.2,
      friction: 0.2,
      frictionAir: 0.01,
      render: {
        sprite: {
          texture: "apple.png",
          xScale: w / 834,
          yScale: h / 1140  
        }
      },
      label: "apple"
    });
  
    Matter.World.add(world, body);
  }

  function cycleGravity() {
    gIndex = (gIndex + 1) % gravities.length;
    engine.gravity.x = gravities[gIndex].x;
    engine.gravity.y = gravities[gIndex].y;
  }

  typingArea.addEventListener('click', (e) => {
    const rect = typingArea.getBoundingClientRect();
    caretBaseX = e.clientX - rect.left;
    caretBaseY = e.clientY - rect.top;

    caretCol = 0;
    buffer = "";
    redrawPreview();

    cursorEl.style.display = 'block';
    active = true;
    typingArea.focus();
    updateCursor();
  });

  typingArea.addEventListener('dblclick', (e) => {
    hintEl.style.left = (e.pageX + 10) + 'px';
    hintEl.style.top  = (e.pageY - 20) + 'px';
    hintEl.style.opacity = 1;
    setTimeout(() => hintEl.style.opacity = 0, 1200);
  });

  document.addEventListener('keydown', (e) => {
    if (!active) return;

    if (e.key === 'Escape') {
      location.reload();
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!buffer.trim()) return;

      if (buffer.toLowerCase() === 'apple') {
        createAppleSprite();
        quake();
        cycleGravity();
      } else {
        commitBufferAsBodies(buffer);
      }

      buffer = "";
      caretCol = 0;
      redrawPreview();
      updateCursor();
      return;
    }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (buffer.length > 0) {
        buffer = buffer.slice(0, -1);
        caretCol = buffer.length;
        redrawPreview();
        updateCursor();
      }
      return;
    }

    if (e.key.length === 1) {
      buffer += e.key;
      caretCol = buffer.length;
      redrawPreview();
      updateCursor();
    }
  });

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();
  
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillStyle = '#413e3e';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
  
    const bodies = Composite.allBodies(world);
  
    for (const b of bodies) {
      if (!b.label || !b.label.startsWith('chunk:')) continue;
  
      const text = b.label.slice(6);
      const p = b.position;
  
      ctx.fillText(text, p.x, p.y);
    }
  
    ctx.restore();
  });

  window.addEventListener('resize', () => {
    const newW = typingArea.clientWidth;
    const newH = typingArea.clientHeight;
  
    // 캔버스 리사이징
    canvasEl.width  = newW * pixelRatio;
    canvasEl.height = newH * pixelRatio;
    canvasEl.style.width  = newW + 'px';
    canvasEl.style.height = newH + 'px';
  
    render.options.width  = newW;
    render.options.height = newH;
  
    // 벽 재생성 (기존 벽 제거 후 새로 만들기)
    Composite.remove(world, walls, true);
    walls.length = 0;
  
    walls.push(
      Bodies.rectangle(newW/2, newH+10, newW, 20, { isStatic: true, render: { visible: false } }),
      Bodies.rectangle(newW/2, -10,     newW, 20, { isStatic: true, render: { visible: false } }),
      Bodies.rectangle(-10,   newH/2,   20,   newH, { isStatic: true, render: { visible: false } }),
      Bodies.rectangle(newW+10,newH/2,  20,   newH, { isStatic: true, render: { visible: false } })
    );
    World.add(world, walls);
  
    // caret 중심을 비율로 재조정 (화면 줄여도 중앙 유지)
    caretBaseX = newW / 2;
    caretBaseY = newH / 2;
  
    redrawPreview();
    updateCursor();
  });
})();
</script>
</body>
</html>
