<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Typing</title>
<style>
  body {
    margin: 0;
    background: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }
  #typing-area {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 700px;
    height: 500px;
    border: 1.2pt solid #aaa;
    border-radius: 10px;
    box-shadow: 4px 4px 14px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  input {
    position: absolute;
    bottom: 10px;
    left: 20px;
    width: 660px;
    padding: 8px;
    font-size: 16px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>

<div id="typing-area"></div>
<input id="textInput" placeholder="Type something and press Enter...">

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Composite } = Matter;

const typingArea = document.getElementById('typing-area');
const input = document.getElementById('textInput');

// Matter.js 기본 세팅
const engine = Engine.create();
const world = engine.world;

const render = Render.create({
  element: typingArea,
  engine: engine,
  options: {
    width: 700,
    height: 500,
    wireframes: false,
    background: 'transparent'
  }
});

Render.run(render);
Runner.run(Runner.create(), engine);

// 벽 추가
const walls = [
  Bodies.rectangle(350, 500, 700, 20, { isStatic: true }),
  Bodies.rectangle(350, 0, 700, 20, { isStatic: true }),
  Bodies.rectangle(700, 250, 20, 500, { isStatic: true }),
  Bodies.rectangle(0, 250, 20, 500, { isStatic: true })
];
World.add(world, walls);

// 중력 순서 (아래 → 왼쪽 → 위 → 오른쪽)
const gravities = [
  {x:0, y:1}, {x:-1, y:0}, {x:0, y:-1}, {x:1, y:0}
];
let gravityIndex = 0;
engine.gravity.x = gravities[gravityIndex].x;
engine.gravity.y = gravities[gravityIndex].y;

// 지진 효과
function earthquake() {
  const bodies = Composite.allBodies(world);
  bodies.forEach(b => {
    Body.applyForce(b, b.position, {
      x: (Math.random() - 0.5) * 0.2,
      y: (Math.random() - 0.5) * 0.2
    });
  });
}

// 텍스트 입력 후 엔터 시 생성
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    // 텍스트 생성 (문자별 박스)
    const letters = text.split('');
    const startX = 350 - (letters.length * 10);
    letters.forEach((char, i) => {
      const body = Bodies.rectangle(startX + i * 20, 50, 20, 20, {
        restitution: 0.4,
        render: {
          fillStyle: '#413e3e',
          text: { content: char }
        },
        label: char
      });
      World.add(world, body);
    });

    // "apple" 입력 시 중력 변경 + 지진
    if (text.toLowerCase() === 'apple') {
      earthquake();
      gravityIndex = (gravityIndex + 1) % gravities.length;
      engine.gravity.x = gravities[gravityIndex].x;
      engine.gravity.y = gravities[gravityIndex].y;
    }
  }
});

// 글자 렌더링 (Matter.js의 텍스트 지원은 없으므로 수동 렌더링)
(function renderText() {
  const ctx = render.context;
  const bodies = Composite.allBodies(world);
  ctx.font = '16px Courier New';
  ctx.fillStyle = '#413e3e';

  Matter.Render.startViewTransform(render);
  bodies.forEach(body => {
    if (body.label.length === 1) {
      const pos = body.position;
      ctx.fillText(body.label, pos.x - 5, pos.y + 5);
    }
  });
  Matter.Render.endViewTransform(render);

  requestAnimationFrame(renderText);
})();
</script>
</body>
</html>
