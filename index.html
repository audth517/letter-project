<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inception</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  /* 요청한 타이틀/설명 좌상단 정렬 */
  #title {
    position: absolute;
    top: 150px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 180px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 270px;
    left: 60px;
    right: 60px;
    bottom: 60px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  .letter, .apple, .temp {
    position: absolute;
    font-family: 'Courier New', monospace';
    color: #413e3e;
    user-select: none;
  }
  .letter { letter-spacing: -8px; }

  .apple {
    width: 23px;
    height: 30px;
    user-select: none;
    -webkit-user-drag: none;
  }

  .temp { opacity: 0.5; }

  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
    display: none; /* 첫 화면 커서 숨김 */
    z-index: 20;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  /* 클릭 지점 안내 힌트 */
  #hint {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 250ms ease, transform 250ms ease;
    z-index: 15;
  }
  #hint.show {
    opacity: 0.6;
    transform: translateY(-6px);
  }
  .hint-text {
    font-size: 14px;
    letter-spacing: 0.02em;
    color: #6b6a69;
    background: rgba(255,255,255,0.5);
    padding: 4px 8px;
    border-radius: 6px;
  }

  .temp.prefix-hint { 
    text-decoration: underline; 
    text-underline-offset: 2px;
    opacity: 0.75;
  }

  /* 화면 지진(apple 확정 시) */
  @keyframes quake {
    10% { transform: translate(-3px, 0); }
    20% { transform: translate(3px, 0); }
    30% { transform: translate(-2px, 0); }
    40% { transform: translate(2px, 0); }
    50% { transform: translate(-1px, 0); }
    60% { transform: translate(1px, 0); }
    100% { transform: translate(0,0); }
  }
  .shake { animation: quake 400ms ease-in-out; }
</style>
</head>
<body>

<div id="title">Apple</div>
<div id="description">This is inspired by the film Inception and Newton's Apple</div>

<div id="typing-area" tabindex="0">
  <div id="hint" aria-hidden="true">
    <span class="hint-text">type anywhere <span class="enter-icon">⏎</span></span>
  </div>
</div>

<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
const hintEl = document.getElementById('hint');

let gravity = 'down';
let elements = [];           // { el, type: 'letter' | 'apple' }
let currentInput = [];       // temp chars buffer
let cursor = {x: 10, y: 10};
const letterSize = 18;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];
let showCursor = false;
let hintTimer = null;

function areaRect() { return typingArea.getBoundingClientRect(); }

function pos(el) {
  return {
    x: parseFloat(el.style.left) || 0,
    y: parseFloat(el.style.top)  || 0
  };
}

function updateCursor() {
  const r = areaRect();
  cursorEl.style.left = (r.left + cursor.x) + 'px';
  cursorEl.style.top  = (r.top  + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

function showHintAt(x, y, text = 'type anywhere ⏎') {
  hintEl.querySelector('.hint-text').innerHTML = text;
  hintEl.style.left = (x + 8) + 'px';
  hintEl.style.top  = (y - 22) + 'px';
  hintEl.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), 1200);
}

typingArea.addEventListener('click', (e) => {
  const rect = areaRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;

  if (!showCursor) {
    showCursor = true;
    cursorEl.style.display = 'block';
  }

  updateCursor();
  typingArea.focus();
  cursorEl.style.animation = "blink 1s step-start infinite";
  showHintAt(cursor.x, cursor.y);
});

/* ---------- 요소 생성 ---------- */
function createTempChar(char, x, y) {
  const temp = document.createElement('span');
  temp.className = 'letter temp';
  temp.textContent = char;
  temp.style.left = x + 'px';
  temp.style.top  = y + 'px';
  typingArea.appendChild(temp);
  return {char, x, y};
}

function createLettersGroup(chars) {
  const group = [];
  for (const obj of chars) {
    const el = document.createElement('span');
    el.className = 'letter';
    el.textContent = obj.char;
    el.style.left = obj.x + 'px';
    el.style.top  = obj.y + 'px';
    typingArea.appendChild(el);
    const item = { el, type: 'letter' };
    group.push(item);
    elements.push(item);
  }

  // 첫 배치 시 충돌 즉시 발생 방지 1px 역중력 보정
  const adjust = 1;
  let ax = 0, ay = 0;
  if (gravity === 'down')  ay = -adjust;
  if (gravity === 'up')    ay =  adjust;
  if (gravity === 'left')  ax =  adjust;
  if (gravity === 'right') ax = -adjust;
  group.forEach(obj => {
    obj.el.style.left = (parseFloat(obj.el.style.left) + ax) + 'px';
    obj.el.style.top  = (parseFloat(obj.el.style.top)  + ay) + 'px';
  });
  return group;
}

function createAppleAt(x, y) {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.alt = 'apple';
  el.className = 'apple';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type:'apple'});
  moveElement(el, 'apple');
}

/* ---------- 충돌/경계 체크 공통 ---------- */
function isBlockedFor(el, nextX, nextY, size) {
  const r = areaRect();

  // 경계
  if (nextX < 0 || nextY < 0 || nextX + size > r.width || nextY + size > r.height) return true;

  // 다른 요소와 충돌
  for (let obj of elements) {
    if (obj.el === el) continue;
    const {x: ox, y: oy} = pos(obj.el);
    const osize = obj.type === 'letter' ? letterSize : appleSize;
    const overlap = !(nextX + size <= ox || nextX >= ox + osize ||
                      nextY + size <= oy || nextY >= oy + osize);
    if (overlap) return true;
  }
  return false;
}

/* ---------- 개별 요소 자연 낙하(apple/잔여 정리용) ---------- */
function moveElement(el, type) {
  const r = areaRect();
  let {x: left, y: top} = pos(el);
  const size = type === 'letter' ? letterSize : appleSize;

  function step() {
    let moved = false;
    if (gravity === 'down') {
      if (!isBlockedFor(el, left, top+2, size)) { top += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'left') {
      if (!isBlockedFor(el, left-2, top, size)) { left -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'up') {
      if (!isBlockedFor(el, left, top-2, size)) { top -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'right') {
      if (!isBlockedFor(el, left+2, top, size)) { left += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    }
    el.style.left = left + 'px';
    el.style.top  = top  + 'px';
    if (moved) requestAnimationFrame(step);
  }
  step();
}

/* ---------- 새로 만든 단어 묶음은 그룹으로 이동(쌓이기) ---------- */
function moveGroupToGravity(group) {
  const step = 2;

  function willBlock(dx, dy) {
    for (let obj of group) {
      const el = obj.el;
      const size = letterSize;
      const nextX = parseFloat(el.style.left) + dx;
      const nextY = parseFloat(el.style.top)  + dy;

      if (isBlockedFor(el, nextX, nextY, size)) return true;
      // 같은 그룹과의 충돌은 별도 무시 (동시에 이동하므로)
    }
    return false;
  }

  function stepOnce() {
    let dx = 0, dy = 0;
    if (gravity === 'down')  dy = step;
    if (gravity === 'up')    dy = -step;
    if (gravity === 'left')  dx = -step;
    if (gravity === 'right') dx = step;

    if (willBlock(dx, dy)) return; // 더 이동 불가 → 정지(=쌓임)

    for (let obj of group) {
      const el = obj.el;
      el.style.left = (parseFloat(el.style.left) + dx) + 'px';
      el.style.top  = (parseFloat(el.style.top)  + dy) + 'px';
    }
    requestAnimationFrame(stepOnce);
  }

  requestAnimationFrame(stepOnce);
}

/* ---------- ★ 핵심: 전체 스윕 이동(중력 방향으로 모든 텍스트가 함께 쏠림) ---------- */
function driftAllAlongGravity() {
  const step = 2;

  function sortedLetters() {
    const list = elements.filter(o => o.type === 'letter').slice();
    if (gravity === 'right') {
      // 오른쪽으로 갈 때는 오른쪽(큰 x)부터 이동 → 내부 상호막힘 방지
      list.sort((a,b) => parseFloat(b.el.style.left) - parseFloat(a.el.style.left));
    } else if (gravity === 'left') {
      list.sort((a,b) => parseFloat(a.el.style.left) - parseFloat(b.el.style.left));
    } else if (gravity === 'down') {
      list.sort((a,b) => parseFloat(b.el.style.top) - parseFloat(a.el.style.top));
    } else if (gravity === 'up') {
      list.sort((a,b) => parseFloat(a.el.style.top) - parseFloat(b.el.style.top));
    }
    return list;
  }

  function pass() {
    const list = sortedLetters();
    let movedAny = false;

    for (let obj of list) {
      const el = obj.el;
      const size = letterSize;
      let {x, y} = pos(el);
      let nx = x, ny = y;

      if (gravity === 'right') nx = x + step;
      else if (gravity === 'left') nx = x - step;
      else if (gravity === 'down') ny = y + step;
      else if (gravity === 'up') ny = y - step;

      if (!isBlockedFor(el, nx, ny, size)) {
        el.style.left = nx + 'px';
        el.style.top  = ny + 'px';
        movedAny = true;
      }
    }

    if (movedAny) requestAnimationFrame(pass);
  }

  requestAnimationFrame(pass);
}

/* ---------- 중력 회전 시 전체 스윕 적용 ---------- */
function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % 4];
  driftAllAlongGravity();
}

/* ---------- 키 입력 ---------- */
typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.el.remove());
    elements = [];
    currentInput = [];
    cursor.x = 10;
    cursor.y = 10;
    gravity = 'down';
    typingArea.querySelectorAll('.temp').forEach(t => t.remove());
    updateCursor();
    return;
  }

  if (e.key === 'Enter') {
    if(currentInput.length === 0) return;
    let word = currentInput.map(c => c.char).join('');
    typingArea.querySelectorAll('.temp').forEach(t => t.remove());

    if (word.toLowerCase() === 'apple') {
      createAppleAt(currentInput[0].x, currentInput[0].y);
      typingArea.classList.add('shake');
      setTimeout(() => typingArea.classList.remove('shake'), 450);
      // 사과 낙하 직후 전체도 현재 중력으로 쏠리게(체감 강화)
      setTimeout(driftAllAlongGravity, 500);
    } else {
      const group = createLettersGroup(currentInput);
      moveGroupToGravity(group);
    }
    currentInput = [];
    return;
  }

  if (e.key === 'Backspace') {
    if (currentInput.length > 0) {
      currentInput.pop();
      const spans = typingArea.querySelectorAll('.temp');
      if (spans.length > 0) spans[spans.length -1].remove();
      typingArea.querySelectorAll('.temp').forEach(t => t.classList.remove('prefix-hint'));

      if (currentInput.length > 0) {
        cursor.x = currentInput[currentInput.length -1].x + letterSize;
        cursor.y = currentInput[currentInput.length -1].y;
      } else {
        cursor.x = 10;
        cursor.y = 10;
      }
      updateCursor();
    }
    return;
  }

  if (e.key.length === 1) {
    const tempChar = createTempChar(e.key, cursor.x, cursor.y);
    currentInput.push(tempChar);

    // apple 프리픽스 힌트
    const wordSoFar = currentInput.map(o => o.char).join('').toLowerCase();
    const prefixes = ['a', 'ap', 'app', 'appl'];
    const isPrefix = prefixes.includes(wordSoFar);
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.classList.remove('prefix-hint'));
    if (isPrefix) temps.forEach(t => t.classList.add('prefix-hint'));

    cursor.x += letterSize;
    updateCursor();
    return;
  }
});

updateCursor();
typingArea.focus();
</script>
</body>
</html>
