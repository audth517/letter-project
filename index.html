<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>: apple</title></title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 140px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
    white-space: pre;
  }

  #description {
    position: absolute;
    top: 165px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 230px;
    left: 60px;
    right: 60px;
    bottom: 100px;
    border: 0.6pt solid #d1d0cf;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  #cursor {
    position: absolute;
    width: 6px;
    height: 18px;
    background-color: #404e3e;
    display: none;
    animation: blink 0.8s infinite;
    pointer-events: none;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  .hint {
    position: absolute;
    padding: 6px 10px;
    border: 1px solid #dbd7d4;
    border-radius: 6px;
    background: rgba(255,255,255,0.95);
    font-size: 12px;
    color: #413e3e;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 2px 2px 8px rgba(188,185,183,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #typing-preview {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }

  .preview-char {
    position: absolute;
    font: 16px 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
  }

  .apple {
    width: 30px;
    height: 41px;
  }

  /* title 안에서 커서 깜빡임 */
  .title-cursor {
    display: inline-block;
    width: 8px;
    background-color: #413e3e;
    margin-left: 2px;
    animation: blink 0.8s infinite;
  }

  @keyframes quake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-2px, 2px); }
    20%  { transform: translate(2px, -2px); }
    30%  { transform: translate(-3px, 1px); }
    40%  { transform: translate(3px, -1px); }
    50%  { transform: translate(-2px, 2px); }
    60%  { transform: translate(2px, -2px); }
    70%  { transform: translate(-1px, 1px); }
    80%  { transform: translate(1px, -1px); }
    90%  { transform: translate(-2px, 0); }
    100% { transform: translate(0, 0); }
  }
  #typing-area.shake {
    animation: quake 0.45s linear 1;
  }
</style>
</head>
<body>

<div id="title">": "</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0">
  <canvas id="matter-canvas"></canvas>
  <div id="typing-preview"></div>
</div>
<div id="cursor"></div>
<div class="hint" id="hint">Type anywhere + press Enter ⏎</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
// ------------------------------
// 🍏 Title Typing Animation
// ------------------------------
const titleEl = document.getElementById('title');
let step = 0;

async function typeTitleLoop() {
  while (true) {
    titleEl.textContent = ':';
    await blinkCursor(2);

    // apple 글자 타이핑
    const text = ' apple';
    for (let i = 0; i < text.length; i++) {
      titleEl.textContent = ':' + text.slice(0, i + 1);
      await wait(150);
    }

    // 깜빡 2번 후 다시 반복
    await blinkCursor(2, ' apple');
  }
}

function wait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function blinkCursor(times = 2, after = '') {
  for (let i = 0; i < times; i++) {
    titleEl.innerHTML = `:${after}<span class="title-cursor"></span>`;
    await wait(300);
    titleEl.innerHTML = `:${after}`;
    await wait(300);
  }
}

typeTitleLoop();

// ------------------------------
// 🍎 기존 Matter.js 로직 (요약: typing area + gravity + apple.png)
// ------------------------------
(() => {
  const { Engine, Render, Runner, World, Bodies, Composite, Events } = Matter;

  const typingArea = document.getElementById('typing-area');
  const cursorEl = document.getElementById('cursor');
  const hintEl = document.getElementById('hint');
  const previewLayer = document.getElementById('typing-preview');

  const engine = Engine.create();
  const world = engine.world;

  const W = typingArea.clientWidth;
  const H = typingArea.clientHeight;

  const render = Render.create({
    element: typingArea,
    engine,
    canvas: document.getElementById('matter-canvas'),
    options: {
      width: W,
      height: H,
      pixelRatio: pixelRatio,
      wireframes: false,
      background: 'transparent'
    }
  });
  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  // 벽을 투명하게
  const walls = [
    Bodies.rectangle(W/2, H+10, W, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(W/2, -10, W, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(-10, H/2, 20, H, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(W+10, H/2, 20, H, { isStatic: true, render: { visible: false } })
  ];
  World.add(world, walls);

  const gravities = [
    {x: 0,  y: 1},
    {x: -1, y: 0},
    {x: 0,  y: -1},
    {x: 1,  y: 0},
  ];
  let gIndex = 0;
  engine.gravity.x = gravities[gIndex].x;
  engine.gravity.y = gravities[gIndex].y;
  engine.gravity.scale = 0.001;

  let active = false;
  let cursorX = W / 2;
  let cursorY = H / 2;
  let buffer = "";
  let previewChars = [];
  const charAdvance = 10;

  typingArea.addEventListener('click', (e) => {
    const rect = typingArea.getBoundingClientRect();
    cursorX = e.clientX - rect.left;
    cursorY = e.clientY - rect.top;
    cursorEl.style.left = (rect.left + cursorX - 2) + 'px';
    cursorEl.style.top = (rect.top + cursorY - 9) + 'px';
    cursorEl.style.display = 'block';
    clearPreview();
    buffer = "";
    active = true;
    typingArea.focus();
  });

  typingArea.addEventListener('dblclick', (e) => {
    hintEl.style.left = (e.pageX + 10) + 'px';
    hintEl.style.top  = (e.pageY - 20) + 'px';
    hintEl.style.opacity = 1;
    setTimeout(() => hintEl.style.opacity = 0, 1200);
  });

  document.addEventListener('keydown', (e) => {
    if (!active) return;
    if (e.key === 'Escape') { location.reload(); return; }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!buffer.trim()) return;
      if (buffer.toLowerCase() === 'apple') {
        createAppleSprite(cursorX, cursorY);
        quake();
        cycleGravity();
      } else {
        commitBufferAsBodies(buffer, cursorX, cursorY);
      }
      buffer = "";
      clearPreview();
      return;
    }

    if (e.key.length === 1) {
      buffer += e.key;
      addPreviewChar(e.key);
    }
  });

  function quake() {
  typingArea.classList.remove('shake'); // 연속 트리거 대비 초기화
  // reflow로 애니메이션 재시작 보장
  void typingArea.offsetWidth;
  typingArea.classList.add('shake');
  setTimeout(() => typingArea.classList.remove('shake'), 500);
  }
  
  function addPreviewChar(ch) {
    const idx = previewChars.length;
    const span = document.createElement('span');
    span.className = 'preview-char';
    span.textContent = ch;
    span.style.left = (cursorX + idx * charAdvance) + 'px';
    span.style.top  = (cursorY - 10) + 'px';
    previewLayer.appendChild(span);
    previewChars.push(span);
  }

  function clearPreview() {
    previewChars.forEach(n => n.remove());
    previewChars = [];
  }

  function commitBufferAsBodies(text, x, y) {
    const letters = text.split('');
    letters.forEach((char, i) => {
      const body = Bodies.circle(x + i * charAdvance, y, 8, {
        restitution: 0.2,
        friction: 0.2,
        frictionAir: 0.01,
        render: { opacity: 0 },
        label: `char:${char}`
      });
      World.add(world, body);
    });
  }

  function createAppleSprite(x, y) {
    const body = Bodies.rectangle(x, y, 30, 41, {
      restitution: 0.2,
      friction: 0.2,
      frictionAir: 0.01,
      render: {
        sprite: {
          texture: "apple.png",
          xScale: 30 / 1020,
          yScale: 41 / 1384
        }
      },
      label: 'apple'
    });
    World.add(world, body);
  }

  function cycleGravity() {
    gIndex = (gIndex + 1) % gravities.length;
    engine.gravity.x = gravities[gIndex].x;
    engine.gravity.y = gravities[gIndex].y;
  }

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#413e3e';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const bodies = Composite.allBodies(world);
    for (const b of bodies) {
      if (!b.label || !b.label.startsWith('char:')) continue;
      const char = b.label.slice(5);
      const p = b.position;
      ctx.fillText(char, p.x, p.y + 1);
    }
    ctx.restore();
  });
})();
</script>
</body>
</html
