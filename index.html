<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>: apple</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 140px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
    white-space: pre;
  }

  #description {
    position: absolute;
    top: 165px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 230px;
    left: 60px;
    right: 60px;
    bottom: 100px;
    border: 0.6pt solid #d1d0cf;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188,185,183,0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  #matter-canvas {
    position: absolute;
    left: 0;
    top: 0;
    image-rendering: pixelated;
  }

  #cursor {
    position: absolute;
    width: 6px;
    height: 18px;
    background-color: #404e3e;
    display: none;
    animation: blink 0.8s infinite;
    pointer-events: none;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  .title-cursor {
    display: inline-block;
    width: 8px;
    height: 20px;
    background-color: #413e3e;
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: bottom;
    transform: translateX(0);
    transition: transform 0.15s linear;
  }

  @keyframes quake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-2px, 2px); }
    20%  { transform: translate(2px, -2px); }
    30%  { transform: translate(-3px, 1px); }
    40%  { transform: translate(3px, -1px); }
    50%  { transform: translate(-2px, 2px); }
    60%  { transform: translate(2px, -2px); }
    70%  { transform: translate(-1px, 1px); }
    80%  { transform: translate(1px, -1px); }
    90%  { transform: translate(-2px, 0); }
    100% { transform: translate(0, 0); }
  }
  #typing-area.shake {
    animation: quake 0.45s linear 1;
  }
</style>
</head>
<body>

<div id="title">": "</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0">
  <canvas id="matter-canvas"></canvas>
  <div id="typing-preview"></div>
</div>
<div id="cursor"></div>
<div class="hint" id="hint">Type anywhere + press Enter ⏎</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
// ------------------------------
// 🍏 Title Typing Animation (cursor tracks actual text width)
// ------------------------------
const titleEl = document.getElementById('title');

function wait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function typeTitleLoop() {
  const cursorHTML = `<span class="title-cursor"></span>`;
  const text = ' apple';

  while (true) {
    titleEl.innerHTML = ':' + cursorHTML;
    const cursorEl = titleEl.querySelector('.title-cursor');
    await wait(400);

    // 누적 글자 폭으로 커서 이동
    for (let i = 0; i < text.length; i++) {
      const typed = text.slice(0, i + 1);
      titleEl.innerHTML = `:${typed}${cursorHTML}`;
      const span = document.createElement('span');
      span.style.font = '24px Courier New, monospace';
      span.style.visibility = 'hidden';
      span.textContent = ':' + typed;
      document.body.appendChild(span);
      const width = span.getBoundingClientRect().width;
      document.body.removeChild(span);

      const cursor = titleEl.querySelector('.title-cursor');
      cursor.style.transform = `translateX(${width}px)`; // 실제 너비 기반 이동
      await wait(150);
    }

    // 완성 후 깜빡임
    const cursor = titleEl.querySelector('.title-cursor');
    for (let i = 0; i < 3; i++) {
      cursor.style.opacity = '0';
      await wait(300);
      cursor.style.opacity = '1';
      await wait(300);
    }
    await wait(600);
  }
}
typeTitleLoop();

// ------------------------------
// 🍎 Matter.js / typing logic (기존 그대로 유지)
// ------------------------------
(() => {
  const { Engine, Render, Runner, World, Bodies, Composite, Events } = Matter;

  const typingArea   = document.getElementById('typing-area');
  const cursorEl     = document.getElementById('cursor');
  const hintEl       = document.getElementById('hint');
  const previewLayer = document.getElementById('typing-preview');
  const canvasEl     = document.getElementById('matter-canvas');

  const pixelRatio = window.devicePixelRatio || 1;
  const Wcss = typingArea.clientWidth;
  const Hcss = typingArea.clientHeight;

  const engine = Engine.create();
  const world = engine.world;

  const render = Render.create({
    element: typingArea,
    engine,
    canvas: canvasEl,
    options: {
      width: Wcss,
      height: Hcss,
      pixelRatio: pixelRatio,
      wireframes: false,
      background: 'transparent'
    }
  });

  canvasEl.width  = Wcss * pixelRatio;
  canvasEl.height = Hcss * pixelRatio;
  canvasEl.style.width  = Wcss + 'px';
  canvasEl.style.height = Hcss + 'px';
  render.context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  const walls = [
    Bodies.rectangle(Wcss/2, Hcss+10, Wcss, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(Wcss/2, -10,     Wcss, 20, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(-10,   Hcss/2,   20,   Hcss, { isStatic: true, render: { visible: false } }),
    Bodies.rectangle(Wcss+10,Hcss/2,  20,   Hcss, { isStatic: true, render: { visible: false } })
  ];
  World.add(world, walls);

  const gravities = [
    {x: 0,  y: 1},
    {x: -1, y: 0},
    {x: 0,  y: -1},
    {x: 1,  y: 0},
  ];
  let gIndex = 0;
  engine.gravity.x = gravities[gIndex].x;
  engine.gravity.y = gravities[gIndex].y;
  engine.gravity.scale = 0.001;

  const measureProbe = document.createElement('span');
  measureProbe.style.position = 'absolute';
  measureProbe.style.visibility = 'hidden';
  measureProbe.style.font = "16px 'Courier New', monospace";
  measureProbe.textContent = 'M';
  document.body.appendChild(measureProbe);
  const charAdvance = measureProbe.getBoundingClientRect().width;
  const charHeight  = measureProbe.getBoundingClientRect().height;
  document.body.removeChild(measureProbe);

  let caretBaseX = Wcss / 2;
  let caretBaseY = Hcss / 2;
  let caretCol = 0;
  let active = false;
  let buffer = "";
  let previewChars = [];

  function logicalToScreenX(col) {
    return caretBaseX + col * charAdvance;
  }
  function logicalToScreenY() {
    return caretBaseY - (charHeight * 0.6);
  }

  function updateCursor() {
    const rect = typingArea.getBoundingClientRect();
    const screenX = logicalToScreenX(caretCol);
    const screenY = caretBaseY;

    cursorEl.style.left = (rect.left + screenX - 2) + 'px';
    cursorEl.style.top  = (rect.top  + screenY - (charHeight * 0.7)) + 'px';
  }

  function clearPreview() {
    previewChars.forEach(n => n.remove());
    previewChars = [];
  }

  function redrawPreview() {
    clearPreview();
    for (let i = 0; i < buffer.length; i++) {
      const span = document.createElement('span');
      span.className = 'preview-char';
      span.textContent = buffer[i];
      span.style.left = logicalToScreenX(i) + 'px';
      span.style.top  = logicalToScreenY()  + 'px';
      previewLayer.appendChild(span);
      previewChars.push(span);
    }
  }

  function quake() {
    typingArea.classList.remove('shake');
    void typingArea.offsetWidth;
    typingArea.classList.add('shake');
    setTimeout(() => typingArea.classList.remove('shake'), 500);
  }

  function commitBufferAsBodies(text) {
    for (let i = 0; i < text.length; i++) {
      const bodyX = logicalToScreenX(i);
      const bodyY = caretBaseY;
      const body = Bodies.circle(bodyX, bodyY, 8, {
        restitution: 0.2,
        friction: 0.2,
        frictionAir: 0.01,
        render: { opacity: 0 },
        label: `char:${text[i]}`
      });
      World.add(world, body);
    }
  }

  function createAppleSprite() {
    const w = 33;
    const h = 45;
    const bodyX = logicalToScreenX(0);
    const bodyY = caretBaseY;
  
    const body = Matter.Bodies.rectangle(bodyX, bodyY, w, h, {
      restitution: 0.2,
      friction: 0.2,
      frictionAir: 0.01,
      render: {
        sprite: {
          texture: "apple.png",
          xScale: w / 834,
          yScale: h / 1140  
        }
      },
      label: "apple"
    });
  
    Matter.World.add(world, body);
  }

  function cycleGravity() {
    gIndex = (gIndex + 1) % gravities.length;
    engine.gravity.x = gravities[gIndex].x;
    engine.gravity.y = gravities[gIndex].y;
  }

  typingArea.addEventListener('click', (e) => {
    const rect = typingArea.getBoundingClientRect();
    caretBaseX = e.clientX - rect.left;
    caretBaseY = e.clientY - rect.top;

    caretCol = 0;
    buffer = "";
    redrawPreview();

    cursorEl.style.display = 'block';
    active = true;
    typingArea.focus();
    updateCursor();
  });

  typingArea.addEventListener('dblclick', (e) => {
    hintEl.style.left = (e.pageX + 10) + 'px';
    hintEl.style.top  = (e.pageY - 20) + 'px';
    hintEl.style.opacity = 1;
    setTimeout(() => hintEl.style.opacity = 0, 1200);
  });

  document.addEventListener('keydown', (e) => {
    if (!active) return;

    if (e.key === 'Escape') {
      location.reload();
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!buffer.trim()) return;

      if (buffer.toLowerCase() === 'apple') {
        createAppleSprite();
        quake();
        cycleGravity();
      } else {
        commitBufferAsBodies(buffer);
      }

      buffer = "";
      caretCol = 0;
      redrawPreview();
      updateCursor();
      return;
    }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (buffer.length > 0) {
        buffer = buffer.slice(0, -1);
        caretCol = buffer.length;
        redrawPreview();
        updateCursor();
      }
      return;
    }

    if (e.key.length === 1) {
      buffer += e.key;
      caretCol = buffer.length;
      redrawPreview();
      updateCursor();
    }
  });

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillStyle = '#413e3e';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const bodies = Composite.allBodies(world);
    for (const b of bodies) {
      if (!b.label || !b.label.startsWith('char:')) continue;
      const char = b.label.slice(5);
      const p = b.position;
      ctx.fillText(char, p.x, p.y + 1);
    }
    ctx.restore();
  });
})();
</script>
</body>
</html>
