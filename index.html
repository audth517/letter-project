<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Text</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Courier New', monospace;
    background: linear-gradient(to bottom, #f1e0e2, #d2cbc6);
    color: #585554;
    overflow: hidden;
    user-select: none;
  }
  #bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40px;
    border-bottom: 1px solid #403d3c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
  }
  #bar-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  #canvas {
    position: absolute;
    top: 40px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
  }
  .text-item {
    position: absolute;
    white-space: pre;
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="bar-left">Esc</div>
    <div id="bar-center">Apple</div>
    <div id="bar-right">Enter</div>
  </div>
  <div id="canvas" tabindex="0"></div>

<script>
  const canvas = document.getElementById('canvas');
  let gravity = 'down'; // down, left, up, right
  let typedText = '';
  let textElements = [];
  let typingPosition = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

  // 클릭한 곳으로 타이핑 위치 이동
  canvas.addEventListener('click', (e) => {
    typingPosition.x = e.clientX;
    typingPosition.y = e.clientY;
    canvas.focus();
  });

  // 중력 회전
  function rotateGravity() {
    const dirs = ['down', 'left', 'up', 'right'];
    gravity = dirs[(dirs.indexOf(gravity) + 1) % 4];
  }

  // 텍스트 이동 (중력 방향)
  function applyGravity(el) {
    const step = 5;
    const interval = setInterval(() => {
      let rect = el.getBoundingClientRect();
      if (gravity === 'down' && rect.bottom < window.innerHeight) {
        el.style.top = rect.top + step + 'px';
      } else if (gravity === 'up' && rect.top > 40) {
        el.style.top = rect.top - step + 'px';
      } else if (gravity === 'left' && rect.left > 0) {
        el.style.left = rect.left - step + 'px';
      } else if (gravity === 'right' && rect.right < window.innerWidth) {
        el.style.left = rect.left + step + 'px';
      } else {
        clearInterval(interval);
      }
    }, 10);
  }

  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      textElements.forEach(el => el.remove());
      textElements = [];
      gravity = 'down';
      typedText = '';
      return;
    }

    if (e.key === 'Backspace') {
      typedText = typedText.slice(0, -1);
      e.preventDefault();
      return;
    }

    if (e.key === 'Enter') {
      if (typedText.toLowerCase() === 'apple') {
        rotateGravity();
      } else if (typedText.length > 0) {
        const span = document.createElement('span');
        span.className = 'text-item';
        span.textContent = typedText;
        canvas.appendChild(span);
        span.style.left = typingPosition.x + 'px';
        span.style.top = typingPosition.y + 'px';
        textElements.push(span);
        applyGravity(span);
      }
      typedText = '';
      e.preventDefault();
      return;
    }

    if (e.key.length === 1) {
      typedText += e.key;
    }
  });
</script>
</body>
</html>
