<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inception</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 60px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 95px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 270px;
    left: 60px;
    right: 60px;
    bottom: 60px;
    border: 1.2pt solid #dbd7d4;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  .letter, .apple, .temp {
    position: absolute;
    font-family: 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
  }
  .letter { letter-spacing: -8px; }

  .apple {
    width: 23px;
    height: 30px;
    user-select: none;
    -webkit-user-drag: none;
  }

  .temp {
    opacity: 0.5;
  }

  #cursor {
    position: absolute;
    width: 6px;
    background-color: #404e3e;
    display: none;
    z-index: 20;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  #hint {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 250ms ease, transform 250ms ease;
    z-index: 15;
  }
  #hint.show {
    opacity: 0.6;
    transform: translateY(-6px);
  }
  .hint-text {
    font-size: 14px;
    letter-spacing: 0.02em;
    color: #6b6a69;
    background: rgba(255,255,255,0.5);
    padding: 4px 8px;
    border-radius: 6px;
  }

  .temp.prefix-hint { 
    text-decoration: underline; 
    text-underline-offset: 2px;
    opacity: 0.75;
  }

  @keyframes quake {
    10% { transform: translate(-3px, 0); }
    20% { transform: translate(3px, 0); }
    30% { transform: translate(-2px, 0); }
    40% { transform: translate(2px, 0); }
    50% { transform: translate(-1px, 0); }
    60% { transform: translate(1px, 0); }
    100% { transform: translate(0,0); }
  }
  .shake { animation: quake 400ms ease-in-out; }
</style>
</head>
<body>

<div id="title">Apple</div>
<div id="description">This is inspired by the film Inception and Newton's Apple</div>

<div id="typing-area" tabindex="0">
  <div id="hint" aria-hidden="true">
    <span class="hint-text">type anywhere <span class="enter-icon">⏎</span></span>
  </div>
</div>

<div id="cursor"></div>

<script>
const typingArea = document.getElementById('typing-area');
const cursorEl = document.getElementById('cursor');
const hintEl = document.getElementById('hint');

let gravity = 'down';
let elements = [];
let currentInput = [];
let cursor = {x: 10, y: 10};
const letterSize = 18;
const appleSize = 30;
const gravityOrder = ['down', 'left', 'up', 'right'];
let showCursor = false;
let hintTimer = null;

function updateCursor() {
  const areaRect = typingArea.getBoundingClientRect();
  cursorEl.style.left = (areaRect.left + cursor.x) + 'px';
  cursorEl.style.top = (areaRect.top + cursor.y) + 'px';
  cursorEl.style.height = letterSize + 'px';
}

function showHintAt(x, y, text = 'type anywhere ⏎') {
  hintEl.querySelector('.hint-text').innerHTML = text;
  hintEl.style.left = (x + 8) + 'px';
  hintEl.style.top  = (y - 22) + 'px';
  hintEl.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), 1200);
}

typingArea.addEventListener('click', (e) => {
  const rect = typingArea.getBoundingClientRect();
  cursor.x = e.clientX - rect.left;
  cursor.y = e.clientY - rect.top;

  if (!showCursor) {
    showCursor = true;
    cursorEl.style.display = 'block';
  }

  updateCursor();
  typingArea.focus();
  cursorEl.style.animation = "blink 1s step-start infinite";
  showHintAt(cursor.x, cursor.y);
});

function createTempChar(char, x, y) {
  const temp = document.createElement('span');
  temp.className = 'letter temp';
  temp.textContent = char;
  temp.style.left = x + 'px';
  temp.style.top = y + 'px';
  typingArea.appendChild(temp);
  return {char, x, y};
}

function createLettersGroup(chars) {
  const group = [];
  for (const obj of chars) {
    const el = document.createElement('span');
    el.className = 'letter';
    el.textContent = obj.char;
    el.style.left = obj.x + 'px';
    el.style.top = obj.y + 'px';
    typingArea.appendChild(el);
    const item = { el, type: 'letter' };
    group.push(item);
    elements.push(item);
  }

  const adjust = 1;
  let ax = 0, ay = 0;
  if (gravity === 'down')  ay = -adjust;
  if (gravity === 'up')    ay =  adjust;
  if (gravity === 'left')  ax =  adjust;
  if (gravity === 'right') ax = -adjust;
  group.forEach(obj => {
    obj.el.style.left = (parseFloat(obj.el.style.left) + ax) + 'px';
    obj.el.style.top  = (parseFloat(obj.el.style.top)  + ay) + 'px';
  });
  return group;
}

function createAppleAt(x, y) {
  const el = document.createElement('img');
  el.src = 'apple.png';
  el.alt = 'apple';
  el.className = 'apple';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  typingArea.appendChild(el);
  elements.push({el, type:'apple'});
  moveElement(el, 'apple');
}

function moveGroupToGravity(group) {
  const area = typingArea.getBoundingClientRect();
  const step = 2;

  function willBlock(dx, dy) {
    for (let obj of group) {
      const selfEl = obj.el;
      const size = letterSize;
      const nextX = parseFloat(selfEl.style.left) + dx;
      const nextY = parseFloat(selfEl.style.top) + dy;
      if (nextX < 0 || nextY < 0 || nextX + size > area.width || nextY + size > area.height) {
        return true;
      }
      for (let other of elements) {
        if (group.some(g => g.el === other.el)) continue;
        const ox = parseFloat(other.el.style.left);
        const oy = parseFloat(other.el.style.top);
        const osize = other.type === 'letter' ? letterSize : appleSize;
        const overlap = !(nextX + size <= ox || nextX >= ox + osize ||
                          nextY + size <= oy || nextY >= oy + osize);
        if (overlap) return true;
      }
    }
    return false;
  }

  function stepOnce() {
    let dx = 0, dy = 0;
    if (gravity === 'down')  dy = step;
    if (gravity === 'up')    dy = -step;
    if (gravity === 'left')  dx = -step;
    if (gravity === 'right') dx = step;
    if (willBlock(dx, dy)) return;
    for (let obj of group) {
      const el = obj.el;
      el.style.left = (parseFloat(el.style.left) + dx) + 'px';
      el.style.top  = (parseFloat(el.style.top) + dy) + 'px';
    }
    requestAnimationFrame(stepOnce);
  }
  requestAnimationFrame(stepOnce);
}

function moveElement(el, type) {
  const area = typingArea.getBoundingClientRect();
  let top = parseFloat(el.style.top);
  let left = parseFloat(el.style.left);
  const size = type === 'letter' ? letterSize : appleSize;

  function isBlocked(nextX, nextY) {
    for (let obj of elements) {
      if (obj.el === el) continue;
      const ox = parseFloat(obj.el.style.left);
      const oy = parseFloat(obj.el.style.top);
      const osize = obj.type === 'letter' ? letterSize : appleSize;
      const overlap = !(nextX + size <= ox || nextX >= ox + osize ||
                        nextY + size <= oy || nextY >= oy + osize);
      if (overlap) return true;
    }
    return false;
  }

  function step() {
    let moved = false;
    if (gravity === 'down') {
      if (top + size + 2 <= area.height && !isBlocked(left, top+2)) { top += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'left') {
      if (left - 2 >= 0 && !isBlocked(left-2, top)) { left -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'up') {
      if (top - 2 >= 0 && !isBlocked(left, top-2)) { top -= 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    } else if (gravity === 'right') {
      if (left + size + 2 <= area.width && !isBlocked(left + 2, top)) { left += 2; moved = true; }
      else if (type === 'apple') rotateGravity();
    }
    el.style.top = top + 'px';
    el.style.left = left + 'px';
    if (moved) requestAnimationFrame(step);
  }
  step();
}

function applyGravityAll() {
  elements.forEach(o => {
    if (o.type === 'apple') return;
    moveElement(o.el, 'letter');
  });
}

function rotateGravity() {
  gravity = gravityOrder[(gravityOrder.indexOf(gravity) + 1) % 4];
  applyGravityAll();
}

typingArea.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    elements.forEach(o => o.el.remove());
    elements = [];
    currentInput = [];
    cursor.x = 10;
    cursor.y = 10;
    gravity = 'down';
    typingArea.querySelectorAll('.temp').forEach(t => t.remove());
    updateCursor();
    return;
  }

  if (e.key === 'Enter') {
    if(currentInput.length === 0) return;
    let word = currentInput.map(c => c.char).join('');
    typingArea.querySelectorAll('.temp').forEach(t => t.remove());
    if (word.toLowerCase() === 'apple') {
      createAppleAt(currentInput[0].x, currentInput[0].y);
      typingArea.classList.add('shake');
      setTimeout(() => typingArea.classList.remove('shake'), 450);
      setTimeout(applyGravityAll, 500);
    } else {
      const group = createLettersGroup(currentInput);
      moveGroupToGravity(group);
    }
    currentInput = [];
    return;
  }

  if (e.key === 'Backspace') {
    if (currentInput.length > 0) {
      currentInput.pop();
      const spans = typingArea.querySelectorAll('.temp');
      if (spans.length > 0) spans[spans.length -1].remove();
      typingArea.querySelectorAll('.temp').forEach(t => t.classList.remove('prefix-hint'));
      if (currentInput.length > 0) {
        cursor.x = currentInput[currentInput.length -1].x + letterSize;
        cursor.y = currentInput[currentInput.length -1].y;
      } else {
        cursor.x = 10;
        cursor.y = 10;
      }
      updateCursor();
    }
    return;
  }

  if (e.key.length === 1) {
    const tempChar = createTempChar(e.key, cursor.x, cursor.y);
    currentInput.push(tempChar);
    const wordSoFar = currentInput.map(o => o.char).join('').toLowerCase();
    const prefixes = ['a', 'ap', 'app', 'appl'];
    const isPrefix = prefixes.includes(wordSoFar);
    const temps = typingArea.querySelectorAll('.temp');
    temps.forEach(t => t.classList.remove('prefix-hint'));
    if (isPrefix) temps.forEach(t => t.classList.add('prefix-hint'));
    cursor.x += letterSize;
    updateCursor();
    return;
  }
});

updateCursor();
typingArea.focus();
</script>
</body>
</html>
