<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>"Apple"</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e6e4e3;
    font-family: 'Courier New', monospace;
    color: #413e3e;
  }

  #title {
    position: absolute;
    top: 140px;
    left: 60px;
    font-size: 24px;
    font-weight: bold;
  }

  #description {
    position: absolute;
    top: 165px;
    left: 60px;
    white-space: pre-line;
    line-height: 1.5em;
  }

  #typing-area {
    position: absolute;
    top: 230px;
    left: 60px;
    right: 60px;
    bottom: 100px;
    border: 1.2pt solid #bebebe;
    border-radius: 9px;
    box-shadow: 6px 6px 17px rgba(188, 185, 183, 0.6);
    background-color: #e6e4e3;
    overflow: hidden;
    cursor: text;
    outline: none;
  }

  #cursor {
    position: absolute;
    width: 6px;
    height: 18px;
    background-color: #404e3e;
    display: none;
    animation: blink 0.8s infinite;
    pointer-events: none;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.1%, 100% { opacity: 0; }
  }

  .hint {
    position: absolute;
    padding: 6px 10px;
    border: 1px solid #dbd7d4;
    border-radius: 6px;
    background: rgba(255,255,255,0.95);
    font-size: 12px;
    color: #413e3e;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 2px 2px 8px rgba(188,185,183,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #typing-preview {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }
  .preview-char {
    position: absolute;
    font: 16px 'Courier New', monospace;
    color: #413e3e;
    user-select: none;
  }

  .apple {
    width: 23px;
    height: 30px;
  }
</style>
</head>
<body>

<div id="title">"Apple"</div>
<div id="description">
This project is inspired by the film 'Inception' and Newton's apple. 
Click anywhere to place the cursor. Type and press Enter. Press Esc to reset.
</div>

<div id="typing-area" tabindex="0">
  <canvas id="matter-canvas"></canvas>
  <div id="typing-preview"></div>
</div>
<div id="cursor"></div>
<div class="hint" id="hint">Type anywhere + press Enter ⏎</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  const { Engine, Render, Runner, World, Bodies, Body, Composite, Events } = Matter;

  const typingArea = document.getElementById('typing-area');
  const cursorEl = document.getElementById('cursor');
  const hintEl = document.getElementById('hint');
  const previewLayer = document.getElementById('typing-preview');

  const engine = Engine.create();
  const world = engine.world;

  const W = typingArea.clientWidth;
  const H = typingArea.clientHeight;

  const render = Render.create({
    element: typingArea,
    engine,
    canvas: document.getElementById('matter-canvas'),
    options: {
      width: W,
      height: H,
      wireframes: false,
      background: 'transparent',
      pixelRatio: window.devicePixelRatio || 1
    }
  });
  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  // 벽 설정
  const walls = [
    Bodies.rectangle(W/2, H+10, W, 20, { isStatic: true }),
    Bodies.rectangle(W/2, -10, W, 20, { isStatic: true }),
    Bodies.rectangle(-10, H/2, 20, H, { isStatic: true }),
    Bodies.rectangle(W+10, H/2, 20, H, { isStatic: true })
  ];
  World.add(world, walls);

  // 중력 방향 순환
  const gravities = [
    {x: 0,  y: 1},
    {x: -1, y: 0},
    {x: 0,  y: -1},
    {x: 1,  y: 0},
  ];
  let gIndex = 0;
  engine.gravity.x = gravities[gIndex].x;
  engine.gravity.y = gravities[gIndex].y;
  engine.gravity.scale = 0.001;

  let active = false;
  let cursorX = W / 2;
  let cursorY = H / 2;
  let buffer = "";
  let previewChars = [];
  const letterBodies = [];
  const charAdvance = 10;

  typingArea.addEventListener('click', (e) => {
    const rect = typingArea.getBoundingClientRect();
    cursorX = e.clientX - rect.left;
    cursorY = e.clientY - rect.top;
    cursorEl.style.left = (rect.left + cursorX - 2) + 'px';
    cursorEl.style.top = (rect.top + cursorY - 9) + 'px';
    cursorEl.style.display = 'block';
    clearPreview();
    buffer = "";
    active = true;
    typingArea.focus();
  });

  typingArea.addEventListener('dblclick', (e) => {
    hintEl.style.left = (e.pageX + 10) + 'px';
    hintEl.style.top  = (e.pageY - 20) + 'px';
    hintEl.style.opacity = 1;
    setTimeout(() => hintEl.style.opacity = 0, 1200);
  });

  document.addEventListener('keydown', (e) => {
    if (!active) return;
    if (e.key === 'Escape') { location.reload(); return; }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (buffer.length > 0) {
        buffer = buffer.slice(0, -1);
        removeLastPreviewChar();
      }
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!buffer.trim()) return;

      if (buffer.toLowerCase() === 'apple') {
        createAppleSprite(cursorX, cursorY);
        cycleGravity();
      } else {
        commitBufferAsBodies(buffer, cursorX, cursorY);
      }
      buffer = "";
      clearPreview();
      return;
    }

    if (e.key.length === 1) {
      buffer += e.key;
      addPreviewChar(e.key);
    }
  });

  function addPreviewChar(ch) {
    const idx = previewChars.length;
    const span = document.createElement('span');
    span.className = 'preview-char';
    span.textContent = ch;
    span.style.left = (cursorX + idx * charAdvance) + 'px';
    span.style.top  = (cursorY - 10) + 'px';
    previewLayer.appendChild(span);
    previewChars.push(span);

    const rect = typingArea.getBoundingClientRect();
    cursorEl.style.left = (rect.left + cursorX + (idx + 0.8) * charAdvance) + 'px';
    cursorEl.style.top  = (rect.top + cursorY - 9) + 'px';
  }

  function removeLastPreviewChar() {
    const last = previewChars.pop();
    if (last) last.remove();
  }

  function clearPreview() {
    previewChars.forEach(n => n.remove());
    previewChars = [];
  }

  function commitBufferAsBodies(text, x, y) {
    const letters = text.split('');
    letters.forEach((char, i) => {
      const body = Bodies.circle(x + i * charAdvance, y, 8, {
        restitution: 0.2,
        friction: 0.2,
        frictionAir: 0.01,
        render: { opacity: 0 },
        label: `char:${char}`
      });
      letterBodies.push(body);
      World.add(world, body);
    });
  }

  // ✅ apple.png 1020×1384 → 23×30로 축소
  function createAppleSprite(x, y) {
    const body = Bodies.rectangle(x, y, 23, 30, {
      restitution: 0.2,
      friction: 0.2,
      frictionAir: 0.01,
      render: {
        sprite: {
          texture: "apple.png",
          xScale: 23 / 1020,  // ≈ 0.02255
          yScale: 30 / 1384   // ≈ 0.02167
        }
      },
      label: 'apple'
    });
    World.add(world, body);
  }

  function cycleGravity() {
    gIndex = (gIndex + 1) % gravities.length;
    engine.gravity.x = gravities[gIndex].x;
    engine.gravity.y = gravities[gIndex].y;
  }

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#413e3e';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const bodies = Composite.allBodies(world);
    for (const b of bodies) {
      if (!b.label || !b.label.startsWith('char:')) continue;
      const char = b.label.slice(5);
      const p = b.position;
      ctx.fillText(char, p.x, p.y + 1);
    }
    ctx.restore();
  });
})();
</script>
</body>
</html>
